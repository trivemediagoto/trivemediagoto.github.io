<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>手作り結婚指輪コース｜レーザー刻印追加 SPワイヤー</title>
  <link rel="stylesheet" href="styles.css?v=20261013-1">
</head>
<body>
  <main class="phone" aria-label="手作り結婚指輪コースのオプション加工へのレーザー刻印追加ワイヤー">
    <div class="capture capture--before-insert" role="img" aria-label="手作り結婚指輪コースの選べるデザインから刻印無料までのカラー実画面キャプチャ"></div>

    <section class="course-option-frame" aria-labelledby="laser-engraving-title">
      <p class="insert-label">今回の追加パーツ（赤枠は確認用・本番には含めない）</p>

      <article class="course-option-wire">
        <div class="course-option-wire__image" role="group" aria-label="書体を選ぶ刻印と手書き刻印の写真配置案">
          <div class="engraving-example">
            <div class="engraving-example__photo" role="img" aria-label="書体を選ぶ文字刻印の写真配置位置">刻印例写真</div>
            <p class="engraving-example__label">書体を選ぶ</p>
          </div>
          <div class="engraving-example">
            <div class="engraving-example__photo" role="img" aria-label="手書きの文字やイラストの刻印写真配置位置">刻印例写真</div>
            <p class="engraving-example__label">手書きで描く</p>
          </div>
        </div>
        <h1 id="laser-engraving-title">レーザー刻印</h1>
        <p class="course-option-wire__description">
          <span>書体を選んで刻む文字も、手書きの文字やイラストも。</span>
          <span>お二人らしいデザインを、指輪の内側に残せます。</span>
          <span>0,000円（税込）〜</span>
        </p>
        <button class="course-download-button" type="button" disabled>記入用紙をダウンロード <span aria-hidden="true">↓</span></button>
      </article>
    </section>

    <div class="capture capture--after-insert" role="img" aria-label="ミルグレイン以降のカラー実画面キャプチャ"></div>
  </main>
</body>
</html>
