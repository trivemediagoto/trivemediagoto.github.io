<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>手作り結婚指輪コース｜レーザー刻印追加 SPワイヤー</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone" aria-label="手作り結婚指輪コースのオプション加工へのレーザー刻印追加ワイヤー">
    <div class="capture capture--before-insert" role="img" aria-label="手作り結婚指輪コースの選べるデザインから刻印無料までのカラー実画面キャプチャ"></div>

    <section class="course-option-frame" aria-labelledby="laser-engraving-title">
      <p class="insert-label">今回の追加パーツ（赤枠は確認用・本番には含めない）</p>

      <article class="course-option-wire">
        <div class="course-option-wire__image" role="img" aria-label="レーザー刻印の写真配置位置">
          <span>レーザー刻印<br>写真</span>
        </div>
        <h1 id="laser-engraving-title">レーザー刻印</h1>
        <p class="course-option-wire__description">
          <span>手書きの文字やイラストを、指輪の内側に刻印できる加工。</span>
          <span>ご来店前に記入用紙で内容を考えられます。</span>
          <span>0,000円（税込）〜</span>
        </p>
      </article>
    </section>

    <div class="capture capture--after-insert" role="img" aria-label="ミルグレイン以降のカラー実画面キャプチャ"></div>
  </main>
</body>
</html>
