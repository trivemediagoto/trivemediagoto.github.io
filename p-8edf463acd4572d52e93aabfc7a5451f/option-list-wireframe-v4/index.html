<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>Option 01 レーザー刻印追加｜オプション加工一覧 SPワイヤー</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone" aria-label="オプション加工一覧の先頭へのOption 01 レーザー刻印追加ワイヤー">
    <div class="capture capture--before-list" role="img" aria-label="現行のオプション加工一覧ページ上部のカラー実画面キャプチャ"></div>

    <section class="option-wire-frame" aria-labelledby="option-01-title">
      <p class="insert-label">今回の追加パーツ（赤枠は確認用・本番には含めない）</p>

      <article class="option-card">
        <header class="option-card__header">
          <p class="option-card__number">Option 01</p>
          <h1 id="option-01-title">レーザー刻印</h1>
        </header>

        <div class="option-card__image" role="img" aria-label="レーザー刻印の写真配置位置">
          <span>レーザー刻印<br>写真</span>
        </div>

        <p class="option-card__description">
          <span>手書きの文字やイラストを、指輪の内側に刻印できる加工。</span>
          <span>お二人らしいモチーフやメッセージを、そのまま指輪に残せ</span>
          <span>ます。ご来店前に記入用紙で内容を考えたり、文字や絵を練</span>
          <span>習したりしながら、刻印するデザインをご検討いただけます。</span>
        </p>

        <div class="option-card__meta">
          <p class="option-card__price">0,000円（税込）〜</p>
          <a class="option-card__more" href="../laser-detail-wireframe-v4/index.html">
            <span>MORE</span><b aria-hidden="true">→</b>
          </a>
        </div>
        <span class="visually-hidden">レーザー刻印の詳細ページへ</span>
      </article>
    </section>

    <div class="capture capture--after-insert" role="img" aria-label="現行のミルグレイン以降のカラー実画面キャプチャ">
      <div class="renumber-overlay" aria-label="ミルグレインをOption 02へ変更">
        <span>Option 02</span>
      </div>
      <p class="renumber-note">以降の番号も＋1</p>
    </div>
  </main>
</body>
</html>
